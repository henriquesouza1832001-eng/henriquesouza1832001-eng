<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Henrique Souza — software para problemas reais</title>
  <desc id="desc">Capa de portfólio com foco em sistemas web, produtos digitais, cloud e engenharia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset=".58" stop-color="#101b31"/>
      <stop offset="1" stop-color="#172743"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
