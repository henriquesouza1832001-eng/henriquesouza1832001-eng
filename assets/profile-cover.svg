  <text x="76" y="204" fill="#c8d5eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Construo produtos digitais que conectam</text>
  <text x="76" y="235" fill="#c8d5eb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">pessoas, operações e dados.</text>
