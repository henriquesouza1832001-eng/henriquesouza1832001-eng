<text x="68" y="678" fill="#c4c0b5" font-family="Arial,sans-serif" font-size="18">Do primeiro problema ao produto que responde.</text>
<text x="68" y="709" fill="#96958c" font-family="Arial,sans-serif" font-size="15">Desenho a experiência e sigo até as regras que a fazem funcionar.</text>
