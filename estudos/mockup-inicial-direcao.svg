<text x="62" y="396" fill="#f0e8d9" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" letter-spacing="-7">EU SIGO</text>
<text x="62" y="492" fill="#f0e8d9" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" letter-spacing="-7">O FIO ATÉ</text>
<text x="62" y="588" fill="#f0e8d9" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" letter-spacing="-7">O <tspan fill="#c57c54">SISTEMA.</tspan></text>
