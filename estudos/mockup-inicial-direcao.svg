<!-- project editorial -->
<g>
 <text x="812" y="1142" fill="#e4b26c" font-family="monospace" font-size="9" letter-spacing="1.2">01 / ROTA DI BUTECO</text>
 <text x="812" y="1213" fill="#f0e8d9" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-3">Uma cidade.</text>
 <text x="812" y="1271" fill="#f0e8d9" font-family="Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-3">Muitos percursos.</text>
 <text x="812" y="1318" fill="#c4c0b5" font-family="Georgia,serif" font-size="18" font-style="italic">O mapa vira uma experiência de grupo.</text>
 <path d="M812 1350H1372" stroke="#e7decf" stroke-opacity=".25"/>
 <text x="812" y="1380" fill="#c57c54" font-family="monospace" font-size="8" letter-spacing="1.1">O PROBLEMA</text>
 <text x="812" y="1407" fill="#c4c0b5" font-family="Arial,sans-serif" font-size="13">Bares, visitas e fotos estavam espalhados</text>
 <text x="812" y="1427" fill="#c4c0b5" font-family="Arial,sans-serif" font-size="13">entre mapa, conversa e memória do grupo.</text>
 <text x="812" y="1471" fill="#c57c54" font-family="monospace" font-size="8" letter-spacing="1.1">A DECISÃO</text>
 <text x="812" y="1498" fill="#c4c0b5" font-family="Arial,sans-serif" font-size="13">Um check-in atualiza lugar, feed e placar</text>
 <text x="812" y="1518" fill="#c4c0b5" font-family="Arial,sans-serif" font-size="13">numa única sequência de uso.</text>
 <path d="M812 1551H1372" stroke="#e7decf" stroke-opacity=".2"/>
 <g fill="#e4b26c" font-family="monospace" font-size="8" letter-spacing=".8"><text x="812" y="1576">PWA</text><text x="865" y="1576">FIREBASE</text><text x="956" y="1576">LEAFLET</text><text x="1047" y="1576">128 BARES · 7 REGIÕES</text></g>
</g>
