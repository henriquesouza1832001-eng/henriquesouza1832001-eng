 <text x="68" y="1720">O texto conta o problema.</text><text x="458" y="1720">A cena mostra a construção.</text><text x="886" y="1720">O projeto prova a decisão.</text>
</g>
<g fill="#8b887e" font-family="monospace" font-size="8" letter-spacing=".8"><text x="68" y="1755">SEM ROLAGEM HORIZONTAL FORÇADA.</text><text x="458" y="1755">SOM SÓ COM ATIVAÇÃO EXPLÍCITA.</text><text x="886" y="1755">CADA NÚMERO TEM FONTE NO REPOSITÓRIO.</text></g>
