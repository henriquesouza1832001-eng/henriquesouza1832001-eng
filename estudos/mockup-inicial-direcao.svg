<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1840" viewBox="0 0 1440 1840" role="img" aria-labelledby="title desc">
<title id="title">Mockup visual da abertura do portfólio Henrique Souza</title>
<desc id="desc">Direção visual escura e editorial. Uma abertura em terminal conduz ao primeiro capítulo interativo sobre a Rota di Buteco.</desc>
